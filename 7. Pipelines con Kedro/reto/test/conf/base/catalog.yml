# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog
tracks:
  type: pandas.CSVDataset
  filepath: data/01_raw/tracks.csv

train_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/train_data.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: false
    encoding: utf-8-sig

test_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/test_data.csv
  load_args:
    encoding: utf-8-sig
  save_args:
    index: False
    encoding: utf-8-sig